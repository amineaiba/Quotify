services:
  db:
    image: pgvector/pgvector:pg17
    env_file: .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quotify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quotify}
      POSTGRES_DB: ${POSTGRES_DB:-quotify}
    ports:
      - "5433:5432"   # 5433 to avoid clashing with a local Postgres on 5432; the api container still talks to `db:5432`
    volumes:
      - quotify_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quotify} -d ${POSTGRES_DB:-quotify}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # 6380 to avoid clashing with a local Redis on 6379

  api:
    build:
      context: .
      target: dev
    env_file: .env.docker
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # Named volume shadows the bind mount at this one path, so the venv
      # built inside the image survives — the host has no .venv to mount over it.
      - quotify_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  quotify_pgdata:
  quotify_venv:
